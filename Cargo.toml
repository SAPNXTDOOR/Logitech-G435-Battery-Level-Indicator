[package]
name = "Logitech-G435"
version = "0.0.1"
edition = "2024"
description = "Tray icon with the battery level of the Logitech G435 headset (Linux and Windows)"
license = "MIT"
repository = "https://github.com/SAPNXTDOOR/Logitech-G435-Battery-Level-Indicator"
authors = ["SAPNXTDOOR"]

[dependencies]
hidapi = { version = "2.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target."cfg(windows)".dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }